# chopin: never idle-suspend.
#
# Do NOT mask sleep.target to achieve this: doing so makes gnome-session shut
# itself down immediately, after which GDM retries the autologin in a loop and
# the panel flashes.  Tell logind instead.
[Login]
IdleAction=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandlePowerKey=ignore
