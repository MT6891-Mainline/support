# chopin: wait for the mediatek DRM display before starting a session.
#
# Without this, GDM autologin can race the display probe: mutter opens
# /dev/dri/card0 (panfrost, render-only, no KMS), then fails to use card1 and
# exits with
#     Failed to setup: No GPUs found
# so gnome-session shuts down, GDM retries in a loop and the panel flashes.
[Unit]
After=systemd-udev-settle.service
Wants=systemd-udev-settle.service

[Service]
ExecStartPre=-/bin/sh -c "for i in $(seq 1 100); do if [ -e /sys/class/drm/card1-DSI-1/status ] && [ \"$(cat /sys/class/drm/card1-DSI-1/status 2>/dev/null)\" = connected ]; then exit 0; fi; sleep 0.1; done; exit 0"
