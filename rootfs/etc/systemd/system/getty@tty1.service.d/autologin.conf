# chopin: the phone has no hardware keyboard, so tty1 logs in automatically and
# the login profile starts the Denial session there.  Denial has to run in a seat
# session: started from the serial console (ttyGS0, no seat) it cannot open the
# DRM device - "Failed to open device: Resource temporarily unavailable".
[Unit]
# The login must not race udev: denial-session refuses to start while
# /dev/dri/card1 does not exist yet, and a failed session used to make the getty
# hit its start limit and leave tty1 dead for the whole boot.
After=systemd-udev-settle.service
# If the compositor does die at login, keep retrying instead of giving up.
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin kily --noclear %I $TERM
