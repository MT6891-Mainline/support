# chopin: the phone has no hardware keyboard, so tty1 logs in automatically and
# the login profile starts the Denial session there.  Denial has to run in a seat
# session: started from the serial console (ttyGS0, no seat) it cannot open the
# DRM device at all - "Failed to open device: Resource temporarily unavailable".
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin kily --noclear %I $TERM
