<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- chopin: allow our SensorProxy replacement to own the standard name.
       The stock system policy denies owning names it has no rule for, which is
       why chopin-sensorproxy ran happily but nobody (Denial included) could see
       net.hadess.SensorProxy on the bus. -->
  <policy user="root">
    <allow own="net.hadess.SensorProxy"/>
    <allow send_destination="net.hadess.SensorProxy"/>
  </policy>

  <policy context="default">
    <allow send_destination="net.hadess.SensorProxy"/>
    <allow receive_sender="net.hadess.SensorProxy"/>
  </policy>
</busconfig>
