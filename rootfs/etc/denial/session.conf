# chopin: administrator overrides for the Denial session.
#
# This is a phone, so use the mobile shell profile instead of the desktop one.
DENIAL_SHELL_PROFILE=mobile

# The display engine (mediatek-drm, card1) and the GPU (panfrost, renderD128)
# are separate DRM nodes on this SoC.  Keep KMS/scanout on card1 and let GBM,
# EGL and Flutter render through the panfrost render node; without this Denial
# refuses to start with
#   "EGL selected /dev/dri/renderD128 instead of requested scene GPU /dev/dri/card1".
DENIAL_DRM_DEVICE=/dev/dri/card1
DENIAL_RENDER_DEVICE=/dev/dri/renderD128
