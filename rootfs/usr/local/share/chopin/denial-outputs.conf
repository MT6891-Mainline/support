# chopin: phone layout for the 1080x2400 DSI panel.
#
# A phone wants a status bar (clock, battery, indicators) pinned to the top and
# almost no padding around maximized windows.  Denial already scales the panel by
# its pixel density (1.75), so nothing else is needed here.
system_bar=top,32
maximize_padding=8

# 60 Hz instead of the panel's native 120 Hz: the DSI link was underrunning
# about a minute into every boot (DDP_COMPONENT_DSI0: buffer underrun), and the
# kernel recovery that follows re-initialises the panel behind the compositor's
# back, which garbles the screen.  Half the refresh rate is half the bandwidth.
mode=DSI-1,1080,2400,60000
